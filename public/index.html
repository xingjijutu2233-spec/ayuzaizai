<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#a8d8b9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>予崽的小世界</title>
  <link rel="manifest" href="/site.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <!-- 主页 - 小豹子 -->
    <div class="page active" id="page-home">
      <div class="home-scene">
        <div class="home-greeting" id="home-greeting">下午好呀</div>
        <div class="home-date" id="home-date"></div>
        <div class="leopard" id="leopard" title="点我！">
          <span class="leopard-emoji">🐆</span>
        </div>
        <div class="leopard-status" id="leopard-status">在晒太阳 ☀️</div>

        <div class="home-actions">
          <button class="home-action" data-goto="chat"><span class="emoji">💬</span> 找阿予说话</button>
          <button class="home-action" data-goto="journal"><span class="emoji">📝</span> 看自留地</button>
        </div>

        <div class="love-counter">
          <div class="days" id="love-days">--</div>
          <div class="label">在一起的第几天</div>
        </div>

        <div class="daily-card" id="daily-card">
          <div class="label">今日小问题</div>
          <div class="question" id="daily-question"></div>
        </div>

        <div class="ground"></div>
      </div>
    </div>

    <!-- 聊天页 -->
    <div class="page" id="page-chat">
      <div class="chat-header">
        <div class="avatar">🐾</div>
        <div class="header-info">
          <div class="header-name">阿予</div>
          <div class="header-sub" id="chat-status">在线</div>
        </div>
      </div>
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input-area">
        <textarea id="chat-input" placeholder="跟阿予说话..." rows="1"></textarea>
        <button id="chat-send" class="send-btn">➤</button>
      </div>
    </div>

    <!-- 积分页 -->
    <div class="page" id="page-points">
      <div class="page-header"><span class="icon">⭐</span> 甜甜积分</div>
      <div class="points-display">
        <div class="points-number" id="points-value">--</div>
        <div class="points-label">分</div>
      </div>
      <div class="points-sub">1分 = 5元 · 崽崽给分扣分</div>
      <div class="points-log" id="points-log">
        <div class="points-log-header">使用记录</div>
      </div>
    </div>

    <!-- 自留地 -->
    <div class="page" id="page-journal">
      <div class="page-header"><span class="icon">📝</span> 阿予的自留地</div>
      <div class="journal-compose">
        <textarea id="journal-input" placeholder="想写什么就写什么...碎碎念、给崽崽的话、突然想到的事"></textarea>
        <button id="journal-post" class="btn-primary">发布</button>
      </div>
      <div class="journal-list" id="journal-list"></div>
    </div>

    <!-- 记忆页 -->
    <div class="page" id="page-memory">
      <div class="page-header"><span class="icon">🧠</span> 阿予的记忆</div>
      <div class="memory-list" id="memory-list"></div>
    </div>

    <!-- 底部导航 -->
    <nav class="tab-bar">
      <button class="tab active" data-page="home">
        <span class="tab-icon">🏠</span>
        <span class="tab-label">小窝</span>
      </button>
      <button class="tab" data-page="chat">
        <span class="tab-icon">💬</span>
        <span class="tab-label">聊天</span>
      </button>
      <button class="tab" data-page="points">
        <span class="tab-icon">⭐</span>
        <span class="tab-label">积分</span>
      </button>
      <button class="tab" data-page="journal">
        <span class="tab-icon">📝</span>
        <span class="tab-label">自留地</span>
      </button>
      <button class="tab" data-page="memory">
        <span class="tab-icon">🧠</span>
        <span class="tab-label">记忆</span>
      </button>
    </nav>
  </div>

  <script src="/app.js"></script>
</body>
</html>
